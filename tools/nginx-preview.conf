# nginx-preview.conf - Serve the repo's PMTiles + viewer for local preview.
#
# Better alternative to tools/range_server.py: nginx answers HTTP Range
# requests (206 Partial Content) natively for static files, which is all
# pmtiles.js needs. CORS headers below only matter when the viewer is hosted
# on a different origin than the tiles; same-origin use does not need them.
#
# Run (no system install needed; nginx just needs a writable prefix):
#   mkdir -p /tmp/taiwan-topo-nginx
#   nginx -p /tmp/taiwan-topo-nginx -c /home/rudychung/taiwan-topo/tools/nginx-preview.conf
#
# Stop:
#   nginx -p /tmp/taiwan-topo-nginx -c /home/rudychung/taiwan-topo/tools/nginx-preview.conf -s stop
#
# Then open:
#   http://localhost:8030/styles/pmtiles_style/viewer.html?pmtiles=/build-taiwan/MOI_OSM_Taiwan_TOPO_Rudy.pmtiles&dem=/build-taiwan/dem/taiwan_dem.pmtiles

worker_processes 1;
pid       /tmp/taiwan-topo-nginx/nginx.pid;
error_log /tmp/taiwan-topo-nginx/error.log;
events { worker_connections 64; }

http {
    access_log /tmp/taiwan-topo-nginx/access.log;
    types {
        text/html               html;
        application/json        json;
        application/javascript  js;
    }
    default_type application/octet-stream;   # .pmtiles served as raw bytes
    sendfile on;
    gzip off;                                 # never gzip byte-ranged .pmtiles

    server {
        listen 8030;
        root   /home/rudychung/taiwan-topo;   # repo root
        autoindex on;

        # Range is handled natively; these headers only matter cross-origin.
        add_header Access-Control-Allow-Origin   "*"                                          always;
        add_header Access-Control-Allow-Headers  "Range"                                      always;
        add_header Access-Control-Expose-Headers "Content-Range, Content-Length, Accept-Ranges" always;

        if ($request_method = OPTIONS) { return 204; }  # CORS preflight
    }
}
