<!DOCTYPE html>
<html>
<head>
  <meta charset="utf-8" />
  <title>Taiwan TOPO — PMTiles viewer</title>
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <link href="https://unpkg.com/maplibre-gl@4.7.1/dist/maplibre-gl.css" rel="stylesheet" />
  <script src="https://unpkg.com/maplibre-gl@4.7.1/dist/maplibre-gl.js"></script>
  <script src="https://unpkg.com/pmtiles@3.2.1/dist/pmtiles.js"></script>
  <style>
    html, body, #map { height: 100%; margin: 0; }
    #hud { position: absolute; top: 8px; left: 8px; z-index: 1; background: rgba(255,255,255,.9);
           font: 12px/1.4 sans-serif; padding: 6px 10px; border-radius: 4px; max-width: 70ch; }
    .err { color: #b00; }
    #layers { position: absolute; top: 8px; right: 50px; z-index: 1; background: rgba(255,255,255,.95);
              font: 13px/1.5 sans-serif; padding: 4px 10px; border-radius: 4px; max-height: 80vh; overflow: auto; }
    #layers summary { cursor: pointer; }
    #layers label { display: block; white-space: nowrap; }
  </style>
</head>
<body>
  <div id="map"></div>
  <div id="hud">starting…</div>
  <details id="layers" hidden><summary>圖層 Layers</summary></details>
  <script>
    const hud = document.getElementById("hud");
    const say = (html, isErr) => { hud.innerHTML = html; hud.classList.toggle("err", !!isErr); };

    // Pass ?pmtiles=<url> for the vector archive (and optional ?dem=<url> for the
    // terrain-RGB DEM). Otherwise both are looked for next to this page. When
    // serving the repo root, use absolute paths, e.g.:
    //   viewer.html?pmtiles=/build-taiwan/MOI_OSM_Taiwan_TOPO_Rudy.pmtiles
    //              &dem=/build-taiwan/dem/taiwan_dem.pmtiles
    // Glyphs are looked for in glyphs/ next to the vector archive (make glyphs).
    const params = new URLSearchParams(location.search);
    const pmtilesUrl = params.get("pmtiles") || "./MOI_OSM_Taiwan_TOPO_Rudy.pmtiles";
    // Default the DEM to a sibling of the vector archive (same folder).
    const demUrl = params.get("dem") || pmtilesUrl.replace(/[^/]+$/, "taiwan_dem.pmtiles");
    // Glyphs (make glyphs) default to a glyphs/ folder next to the vector
    // archive; ?glyphs=<url with {fontstack} and {range}> points elsewhere.
    // MapLibre needs an absolute URL, and the braces must stay unencoded.
    const glyphsUrl = params.get("glyphs") ||
      new URL(".", new URL(pmtilesUrl, location.href)).href + "glyphs/{fontstack}/{range}.pbf";
    // The sprite (make sprite) sits in sprite/ next to the archive too;
    // ?sprite=<url without .json/.png> points elsewhere.
    const spriteUrl = params.get("sprite") ||
      new URL(".", new URL(pmtilesUrl, location.href)).href + "sprite/sprite";

    // Overlay switches, as in the Mapsforge theme's style menu. style.json's
    // metadata lists the overlays and each layer the theme cats it needs; a
    // layer is drawn when every one of its cats is active, and a cat is active
    // when the style has it or a switched-on overlay holds it.
    function overlayMenu(map, style) {
      const md = style.metadata || {};
      const overlays = md["taiwan-topo:overlays"];
      if (!overlays || !overlays.length) return;
      const styleCats = md["taiwan-topo:style-cats"] || [];
      const on = {};
      for (const o of overlays) on[o.id] = o.enabled;
      const apply = () => {
        const active = new Set(styleCats);
        for (const o of overlays) if (on[o.id]) o.cats.forEach((c) => active.add(c));
        for (const l of style.layers) {
          const cats = l.metadata && l.metadata["taiwan-topo:cats"];
          if (!cats) continue;
          // the cats decide: a layer of an overlay that is off by default
          // starts hidden in style.json and shows once that overlay is on
          const shown = cats.every((c) => active.has(c));
          map.setLayoutProperty(l.id, "visibility", shown ? "visible" : "none");
        }
      };
      const box = document.getElementById("layers");
      for (const o of overlays) {
        const label = document.createElement("label");
        const input = document.createElement("input");
        input.type = "checkbox";
        input.checked = o.enabled;
        input.onchange = () => { on[o.id] = input.checked; apply(); };
        label.append(input, " " + (o.name.zh || o.name.en || o.id));
        box.append(label);
      }
      box.hidden = false;
      apply();
    }

    async function main() {
      if (typeof maplibregl === "undefined" || typeof pmtiles === "undefined") {
        return say("CDN libraries (maplibre-gl / pmtiles) did not load. Is the browser online / not blocking unpkg.com?", true);
      }

      // Load the topo style and point its source at the archive.
      let style;
      try { style = await (await fetch("./style.json?t=" + Date.now(), { cache: "no-store" })).json(); }
      catch (e) { return say("Could not load style.json next to this page: " + e, true); }
      style.sources.topo.url = "pmtiles://" + pmtilesUrl;
      if (style.sources.dem) style.sources.dem.url = "pmtiles://" + demUrl;
      style.glyphs = glyphsUrl;
      style.sprite = spriteUrl;

      const protocol = new pmtiles.Protocol();
      maplibregl.addProtocol("pmtiles", protocol.tile);

      const map = new maplibregl.Map({
        container: "map", style, center: [120.96, 23.7], zoom: 7, hash: true, maxZoom: 20
      });
      map.on("load", () => overlayMenu(map, style));
      map.addControl(new maplibregl.NavigationControl());
      map.addControl(new maplibregl.ScaleControl());
      say("Taiwan TOPO — " + pmtilesUrl);
      map.on("error", (e) => {
        const m = (e && e.error && e.error.message) || String(e);
        say("Map error: " + m, true);
        console.error(e);
      });
    }
    main();
  </script>
</body>
</html>
