<!DOCTYPE html>
<html lang="zh-Hant">
<head>
  <meta charset="utf-8">
  <title>魯地圖 — MOI.OSM Taiwan TOPO 詳細圖例 v{{VERSION}}</title>
  <style>
    {{SHARED_PDF_CSS}}
    @page {
      size: A4 portrait;
      margin: 14mm 13mm 15mm 13mm;
    }
    body {
      font-size: 9.5pt;
      line-height: 1.45;
      color: #1a2420;
    }
    .doc-header {
      padding: 12px 16px;
      border-radius: 10px;
      background: var(--pdf-header-bg);
      color: #ffffff;
      margin-bottom: 14px;
    }
    .doc-header h1 { margin: 0 0 4px; font-size: 16pt; font-weight: 800; }
    .doc-header p { margin: 0; font-size: 9pt; opacity: 0.9; }

    .pdf-section { margin-bottom: 16px; }
    .pdf-section h2 {
      margin: 0 0 3px;
      padding: 4px 10px;
      background: #e9f2ec;
      border-left: 4px solid var(--pdf-accent);
      font-size: 11.5pt;
      color: var(--pdf-group-ink);
      page-break-after: avoid;
    }
    .sec-desc { margin: 0 0 6px; font-size: 8.5pt; color: #52635b; page-break-after: avoid; }

    .legend-table {
      width: 100%;
      border-collapse: collapse;
      table-layout: fixed;
    }
    .legend-table thead { display: table-header-group; }
    .legend-table tr { page-break-inside: avoid; break-inside: avoid; }
    .legend-table th {
      text-align: left;
      font-size: 8.5pt;
      padding: 5px 8px;
      background: #f3f6f4;
      border: 1px solid #d2dcd6;
      color: #31443b;
    }
    .legend-table td {
      padding: 6px 8px;
      border: 1px solid #dce5de;
      vertical-align: middle;
    }
    .col-name { width: 46%; }
    .col-svg { width: 22%; text-align: center; }
    .col-sample { width: 32%; text-align: center; }
    .legend-table th.col-svg, .legend-table th.col-sample { text-align: center; }

    .row-title { font-weight: 700; font-size: 9.5pt; color: #15211c; margin-bottom: 2px; }
    .row-desc { font-size: 8.3pt; color: #43544c; margin-bottom: 4px; }
    .row-meta { display: flex; flex-wrap: wrap; gap: 4px; align-items: center; }
    .meta-badge {
      display: inline-block; padding: 0.5px 5px; border-radius: 4px;
      background: #eef3ef; color: #3d5147; font-size: 7.2pt; font-weight: 600;
    }
    .badge-off { background: #fff3dc; color: #8c4f05; }
    .row-tag {
      font-size: 7pt; color: #677a70;
      font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace;
      word-break: break-all;
    }

    .legend-svg {
      display: inline-block;
      width: 108px;
      height: 59px;
      max-width: 100%;
      border: 1px solid #dde4df;
      border-radius: 6px;
      background: #f7f6f1;
    }
    .pdf-sample img {
      display: block;
      width: 100%;
      max-height: 74px;
      object-fit: cover;
      border-radius: 5px;
      border: 1px solid #cfd9d2;
    }
    .pdf-sample-cap { font-size: 7.2pt; color: #5a6d63; margin-top: 2px; }
    .no-sample { font-size: 8pt; color: #94a39b; }

    /* Compact multi-column grid for dense/secondary items in detail PDF */
    .pdf-dense-subhead {
      margin: 8px 0 4px;
      padding-left: 6px;
      border-left: 3px solid #9ab3a4;
      font-size: 8.5pt;
      font-weight: 700;
      color: #465b50;
      page-break-after: avoid;
    }
    .pdf-dense-grid {
      display: grid;
      grid-template-columns: repeat(3, minmax(0, 1fr));
      gap: 4px 6px;
    }
    .pdf-dense-card {
      display: flex;
      align-items: center;
      gap: 5px;
      min-width: 0;
      padding: 4px 5px;
      border: 0.6pt solid #dce5de;
      border-radius: 4px;
      background: #ffffff;
      break-inside: avoid;
      page-break-inside: avoid;
    }
    .pdf-dense-swatch {
      flex-shrink: 0;
      display: flex;
      align-items: center;
      justify-content: center;
      border-radius: 4px;
      overflow: hidden;
      border: 0.5pt solid #d4ddd7;
      background: #f7f6f1;
    }
    .pdf-dense-swatch-point { width: 26px; height: 26px; }
    .pdf-dense-swatch-line, .pdf-dense-swatch-area { width: 46px; height: 22px; }
    .pdf-dense-swatch .legend-svg { width: 100%; height: 100%; max-height: none; border: none; border-radius: 0; }
    .pdf-dense-body { min-width: 0; flex: 1 1 auto; }
    .pdf-dense-title { font-weight: 700; font-size: 7.8pt; color: #15211c; line-height: 1.25; }
    .pdf-dense-desc { font-size: 6.7pt; color: #52635b; line-height: 1.25; margin: 1px 0 2px; }
  </style>
</head>
<body>
  <header class="doc-header">
    <h1>魯地圖 — MOI.OSM Taiwan TOPO 詳細圖例</h1>
    <p>版本：v{{VERSION}} · 共收錄 {{TOTAL}} 項圖徵 · 自動由 MOI_OSM.xml 產生 · 橘底「需開啟：…」標籤為預設關閉圖層</p>
  </header>
  {{SECTIONS}}
</body>
</html>
