# 魯地圖 (MOI.OSM Taiwan TOPO) 自動圖例設定檔
#
# 所有圖示外觀（顏色、線寬、虛線、紋理、SVG、縮放層級、圖層開關）
# 皆由 tools/build_legend.py 直接從 styles/mapsforge_style/MOI_OSM.xml 自動抽取與繪製。
#
# 常用欄位說明（[[items]]）：
# - compact (bool，預設 false)
#     設為 true 時，該項目會收錄於 2 頁速查表 PDF（legend_compact.pdf），
#     並在網頁版 legend.html 的「僅看登山核心」篩選條件中顯示。
# - dense (bool，預設 false；亦可設於 [[categories]])
#     設為 true 時，於網頁版與詳細版 PDF 採用緊湊多欄排版，不預留實景範例欄位，
#     且 `--auto-discover` 會自動略過（適合次要生活／休閒／細分輔助圖示）。
# - example (table，選填)
#     指定實景地圖範例位置，格式為：
#       example = { place = "地名", lat = 緯度, lon = 經度, zoom = 縮放, pin = false }
#     - place：顯示於卡片與 PDF 的實景地名。
#     - lat / lon / zoom：截圖起始座標與縮放層級。
#     - pin (bool，預設 false)：設為 true 時鎖定於指定 (lat, lon) 直接驗證並截圖，
#       不自動吸附至線段中點（適合像纜車橫槓等需精準對齊特定記號的線型）。
#     - 若未填寫 example：
#       1. 執行 `make legend_samples` 時會略過該項，不產生實景截圖；
#          產出的網頁（legend.html）與詳細版 PDF（legend_detail.pdf）僅顯示簡化圖示，
#          不顯示實景縮圖與地圖連結。
#       2. 若要自動尋找台灣實景並補齊，可手動執行：
#            python3 tools/capture_legend_samples.py --auto-discover --update-catalog
#          程式會依序掃描台灣代表區域，找到並驗證繪製結果後自動截圖並將 example 寫回本檔。

[[categories]]
id = "trails"
name = "登山步道與山徑"
desc = "各類登山步道、難度分級、林道、路線標記與輔助設施。"

[[categories]]
id = "terrain"
name = "等高線、地形與水域"
desc = "等高線、懸崖、溪流、瀑布、溫泉與自然水體。"

[[categories]]
id = "landcover"
name = "地表覆蓋與植被"
desc = "森林種類、草地、裸岩、碎石坡、農地與台灣巨木。"

[[categories]]
id = "borders"
name = "界線與管制區域"
desc = "國家公園、保護區、林班地、行政區界與軍事管制區。"

[[categories]]
id = "peaks"
name = "山頭、鞍部與基點"
desc = "大小百岳、山頭、三角點、圖根點、水準點與觀景特徵。"

[[categories]]
id = "shelters"
name = "山屋、營地與住宿"
desc = "高山山屋、工寮、避難小屋、涼亭、營地與旅宿。"

[[categories]]
id = "emergency"
name = "水源、緊急救援與通訊"
desc = "飲用水、求救設施、醫療警消、直升機停機坪、防空避難與電信。"

[[categories]]
id = "roads"
name = "道路、鐵路與大眾運輸"
desc = "國道、省縣道、高鐵台鐵捷運、纜車、車站與交通設施。"

[[categories]]
id = "barriers"
name = "障礙物與路障"
desc = "柵欄、閘門、越柵梯、擋車柱與路況管制點。"

[[categories]]
id = "amenities"
name = "公共設施、人文與生活服務"
desc = "廁所、導覽、宗教古蹟、餐飲商店、休閒與電力設施。"

[[categories]]
id = "secondary"
name = "其他次要商店、休閒與輔助圖示"
desc = "次要生活商店、運動休閒、紀念物、發電廠與輔助交通符號（精簡密集排版，不另附實景範例）。"
dense = true

