<!DOCTYPE html>
<html lang="zh-Hant">
<head>
  <meta charset="utf-8">
  <title>魯地圖 — 登山圖例速查表 v{{VERSION}}</title>
  <style>
    @page {
      size: A4 portrait;
      margin: 6.5mm 7.5mm 6.5mm 7.5mm;
    }
    * { box-sizing: border-box; }
    body {
      margin: 0;
      font-family: "Noto Sans CJK TC", "Noto Sans TC", "PingFang TC", "Microsoft JhengHei", sans-serif;
      font-size: 8.1pt;
      line-height: 1.24;
      color: #18231e;
      background: #ffffff;
    }
    .sheet {
      min-height: 280mm;
      display: flex;
      flex-direction: column;
      page-break-after: always;
      break-after: page;
    }
    .sheet:last-child {
      page-break-after: auto;
      break-after: auto;
    }
    .c-header {
      display: flex;
      align-items: baseline;
      justify-content: space-between;
      gap: 8px;
      padding: 5px 11px;
      border-radius: 6px;
      background: #1b4332;
      color: #ffffff;
      margin-bottom: 5.5px;
      flex-shrink: 0;
    }
    .c-header h1 { margin: 0; font-size: 11pt; font-weight: 800; white-space: nowrap; }
    .c-header span { font-size: 7.4pt; opacity: 0.92; white-space: nowrap; }

    .c-body {
      flex: 1 1 auto;
      display: flex;
      flex-direction: column;
      justify-content: space-between;
      gap: 4px;
    }
    .c-group { margin: 0; }
    .c-group-title {
      margin: 0 0 2.5px;
      padding: 1.8px 8px;
      background: #e6f0ea;
      border-left: 3.5px solid #246346;
      font-size: 8.4pt;
      font-weight: 800;
      color: #163a2a;
    }
    .c-grid {
      display: grid;
      grid-template-columns: repeat(2, minmax(0, 1fr));
      gap: 2.5px 7px;
    }
    .c-item {
      display: flex;
      align-items: center;
      gap: 7px;
      min-width: 0;
      overflow: hidden;
      padding: 2px 6px;
      border: 0.6pt solid #dce5de;
      border-radius: 4px;
      background: #ffffff;
      min-height: 28px;
      break-inside: avoid;
    }
    .c-swatch {
      flex-shrink: 0;
      display: flex;
      align-items: center;
      justify-content: center;
      border-radius: 4px;
      overflow: hidden;
      border: 0.5pt solid #d4ddd7;
      background: #f7f6f1;
    }
    .c-swatch-line, .c-swatch-area { width: 70px; height: 23px; }
    .c-swatch-point { width: 28px; height: 24px; }
    .c-swatch .legend-svg { width: 100%; height: 100%; display: block; }

    .c-text { min-width: 0; flex: 1 1 auto; }
    .c-name {
      font-weight: 700;
      font-size: 8pt;
      color: #14201b;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }
    .c-note {
      display: inline-block;
      padding: 0 4px;
      margin-left: 4px;
      border-radius: 3px;
      background: #fff3dc;
      color: #8c4f05;
      font-weight: 700;
      font-size: 6.6pt;
      vertical-align: 0.5px;
    }
    .c-desc {
      font-size: 6.9pt;
      color: #53655c;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }
    .c-foot {
      margin-top: 4px;
      padding-top: 2.5px;
      border-top: 0.5pt solid #dce5de;
      text-align: right;
      font-size: 6.8pt;
      color: #677a70;
      flex-shrink: 0;
    }
  </style>
</head>
<body>
  <div class="sheet">
    <header class="c-header">
      <h1>魯地圖 (MOI.OSM) 登山圖例速查表 · 正面</h1>
      <span>v{{VERSION}} · 步道・地形・地表・界線（共 {{COUNT}} 項）· 橘底標籤為預設關閉圖層</span>
    </header>
    <div class="c-body">{{PAGE1}}</div>
    <div class="c-foot">第 1 / 2 頁 — 建議單張 A4 雙面列印折疊攜帶</div>
  </div>

  <div class="sheet">
    <header class="c-header">
      <h1>魯地圖 (MOI.OSM) 登山圖例速查表 · 背面</h1>
      <span>v{{VERSION}} · 橘底標籤「需開啟：…」為預設關閉圖層，請於 APP 圖層選單開啟</span>
    </header>
    <div class="c-body">{{PAGE2}}</div>
    <div class="c-foot">第 2 / 2 頁 — 完整圖例與互動檢索請見魯地圖下載頁「互動圖例（legend.html）」</div>
  </div>
</body>
</html>
