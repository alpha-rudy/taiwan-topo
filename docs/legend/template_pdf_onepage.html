<!DOCTYPE html>
<html lang="zh-Hant">
<head>
  <meta charset="utf-8">
  <title>魯地圖 — 一頁登山圖例速查表 v{{VERSION}}</title>
  <style>
    {{SHARED_PDF_CSS}}
    @page {
      size: A4 portrait;
      margin: 4.5mm 5mm 4.5mm 5mm;
    }
    body {
      font-size: 8.2pt;
      line-height: 1.18;
    }
    .sheet {
      height: 287mm;
      display: flex;
      flex-direction: column;
      overflow: hidden;
    }
    .o-header {
      display: flex;
      align-items: baseline;
      justify-content: space-between;
      gap: 8px;
      padding: 4.5px 10px;
      border-radius: 5px;
      background: var(--pdf-header-bg);
      color: #ffffff;
      margin-bottom: 4px;
      flex-shrink: 0;
    }
    .o-header h1 { margin: 0; font-size: 10.8pt; font-weight: 800; white-space: nowrap; }
    .o-header span { font-size: 7.1pt; opacity: 0.92; white-space: nowrap; }

    .o-body {
      flex: 1 1 auto;
      display: flex;
      flex-direction: column;
      justify-content: space-between;
      gap: 3px;
    }
    .o-group { margin: 0; }
    .o-group-title {
      margin: 0 0 2px;
      padding: 1.5px 7px;
      background: #e6f0ea;
      border-left: 3px solid #246346;
      font-size: 8.1pt;
      font-weight: 800;
      color: #163a2a;
      line-height: 1.28;
    }
    .o-grid {
      display: grid;
      grid-template-columns: repeat(4, minmax(0, 1fr));
      gap: 2.5px 4.5px;
    }
    .o-grid-5 {
      grid-template-columns: repeat(5, minmax(0, 1fr));
      gap: 2.5px 4px;
    }
    .o-item {
      display: flex;
      align-items: center;
      gap: 5px;
      min-width: 0;
      overflow: hidden;
      padding: 2px 4.5px;
      border: 0.5pt solid #dce5de;
      border-radius: 3.5px;
      background: #ffffff;
      height: 31px;
    }
    .o-grid-5 .o-item {
      gap: 4px;
      padding: 2px 4px;
    }
    .o-swatch {
      flex-shrink: 0;
      display: flex;
      align-items: center;
      justify-content: center;
      border-radius: 3px;
      overflow: hidden;
      border: 0.45pt solid #d4ddd7;
      background: #f7f6f1;
    }
    .o-swatch-line, .o-swatch-area { width: 52px; height: 25px; }
    .o-swatch-point { width: 27px; height: 25px; }
    .o-swatch .legend-svg { width: 100%; height: 100%; display: block; }

    .o-text {
      min-width: 0;
      flex: 1 1 auto;
      display: flex;
      flex-direction: column;
      justify-content: center;
    }
    .o-name {
      font-weight: 700;
      font-size: 8.1pt;
      line-height: 1.16;
      color: #14201b;
      display: -webkit-box;
      -webkit-line-clamp: 2;
      -webkit-box-orient: vertical;
      overflow: hidden;
    }
    .o-grid-5 .o-name {
      font-size: 7.3pt;
      line-height: 1.1;
      -webkit-line-clamp: 3;
    }
    .o-note {
      display: inline-block;
      margin-left: 2px;
      padding: 0 3px;
      border-radius: 2.5px;
      background: #fff3dc;
      color: #8c4f05;
      font-weight: 700;
      font-size: 5.9pt;
      line-height: 1.3;
      vertical-align: 0.5px;
      white-space: nowrap;
    }
    .o-grid-5 .o-note {
      font-size: 5.5pt;
      padding: 0 2.5px;
    }
    .o-foot {
      margin-top: 3px;
      padding-top: 2px;
      border-top: 0.5pt solid #dce5de;
      display: flex;
      justify-content: space-between;
      font-size: 6.6pt;
      color: #677a70;
      flex-shrink: 0;
    }
  </style>
</head>
<body>
  <div class="sheet">
    <header class="o-header">
      <h1>魯地圖 (MOI.OSM) 一頁圖例速查表</h1>
      <span>v{{VERSION}} · 共 {{COUNT}} 項 · 橘底「開：…」為預設關閉圖層，請於 APP 圖層選單開啟</span>
    </header>
    <div class="o-body">{{BODY}}</div>
    <footer class="o-foot">
      <span>單頁 A4 列印版（僅含圖示與名稱）</span>
      <span>完整說明與互動檢索請見魯地圖下載頁「互動圖例（legend.html）」或詳細版／2 頁速查表 PDF</span>
    </footer>
  </div>
</body>
</html>
